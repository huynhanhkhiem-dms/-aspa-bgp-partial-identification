name: Publish reproducibility package

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aspa-unpack"
          cat .bootstrap/part-*.txt | tr -d '\n\r' | base64 --decode > "$RUNNER_TEMP/aspa-repo.tar.xz"
          tar -xJf "$RUNNER_TEMP/aspa-repo.tar.xz" -C "$RUNNER_TEMP/aspa-unpack"
          cp -a "$RUNNER_TEMP/aspa-unpack/." .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit published artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Publish ASPA-BGP reproducibility package"
          git push
